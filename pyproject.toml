[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borgesica"
version = "0.1.0"
description = "Translation engine for SRT, EPUB, and PDF files to neutral Spanish"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "srt>=3.5",
    "anthropic>=0.25",
]

[project.optional-dependencies]
epub = ["ebooklib>=0.18"]
pdf = ["pdfplumber>=0.10"]
pdf-fast = ["pymupdf4llm>=0.0.5"]  # WARNING: AGPL-3.0 license — opt-in only
spacy = ["spacy>=3.7"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4"]

[project.scripts]
borgesica = "borgesica.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["borgesica*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
