[package]
name = "sidecar-logic"
version = "0.1.0"
edition = "2021"
description = "Pure, tauri-free decision logic for the borgesica sidecar lifecycle (spawn args, ready-line parsing, teardown timing)."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sidecar_logic"
path = "src/lib.rs"
