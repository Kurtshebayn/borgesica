scope:
  goal: >-
    The reading app's built-in navigation menu (EPUB3 nav doc + toc.ncx) must be
    in the target language, with EPUB validity preserved and zero regressions on
    books without a nav document.
  work_phases:
    v1: Translate EPUB3 nav-doc labels (<a> + nav <h1>/<h2>) via existing pipeline.
    v2: Copy v1-translated labels into toc.ncx by href match at write time (zero cost).

decisions:
  translate_nav: always-on
  reflective_mode_for_labels: false
  ncx_only_book_fallback: out-of-scope
  translate_nav_heading: true
  nav_href_meta: "str | None"
  landmarks: true
  page_list: false
  title_reuse: deferred
