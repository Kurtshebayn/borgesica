[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borgesica"
version = "0.1.0"
description = "Translation engine for SRT, EPUB, and PDF files to neutral Spanish"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "srt>=3.5",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
epub = ["ebooklib>=0.18"]
pdf = ["pdfplumber>=0.10"]
openai-compat = ["openai>=1.0"]   # OpenAI-compatible providers (DeepSeek, OpenRouter, etc.)
serve = ["fastapi>=0.110", "uvicorn>=0.29"]  # borgesica.serve driving adapter (desktop sidecar)
spacy = ["spacy>=3.7"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "fpdf2>=2.7", "pyyaml>=6.0"]
packaging = ["pyinstaller>=6.0"]  # T1 packaging spike — freezing the CLI as a desktop sidecar

[project.scripts]
borgesica = "borgesica.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["borgesica*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
